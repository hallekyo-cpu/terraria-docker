version: '3.8'

services:
  terraria:
    build: .
    container_name: terraria-server
    ports:
      - "7777:7777"
    volumes:
      - ./worlds:/terraria/worlds
      - ./config:/terraria/config
    restart: unless-stopped
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
